<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>3 Cards Border Inverted</title>

<style>
body {
  background: #0f172a;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* container */
.cards {
  display: flex;
  gap: 30px;
  flex-wrap: wrap;
}

/* card */
.card {
  position: relative;
  width: 260px;
  padding: 25px;
  border-radius: 18px;
  background: #111827;
  color: white;
  overflow: hidden;
  transition: 0.4s;
}

/* border inverted */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  padding: 2px;
  border-radius: 18px;

  background: linear-gradient(135deg, #00f, #0ff, #00f);

  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

  -webkit-mask-composite: xor;
  mask-composite: exclude;
}

/* hover effect */
.card:hover {
  transform: translateY(-10px);
  background: #020617;
}

/* title */
.card h3 {
  margin-bottom: 10px;
}

/* text */
.card p {
  opacity: 0.8;
  font-size: 14px;
}
</style>

</head>

<body>

<div class="cards">

  <div class="card">
    <h3>🌴 Adventure</h3>
    <p>Explore des paysages uniques et sauvages à Madagascar.</p>
  </div>

  <div class="card">
    <h3>🌊 Lagoon</h3>
    <p>Profitez d’un séjour calme avec vue sur un lagon exceptionnel.</p>
  </div>

  <div class="card">
    <h3>🔥 Experience</h3>
    <p>Vivez une expérience authentique avec des guides locaux.</p>
  </div>

</div>

</body>
</html>
