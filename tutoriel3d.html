<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Carrousel 3D | Zoom & Bordure Dynamique</title>
    <!-- Google Fonts & Font Awesome 6 (images vectorielles) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* évite la sélection intempestive */
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #0a0f1e, #020408);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            padding: 2rem;
        }

        /* Conteneur principal 3D */
        .card-3d {
            position: relative;
            width: 780px;
            height: 420px;
            transform-style: preserve-3d;
            transform: perspective(1300px);
            animation: rotateCarousel 30s linear infinite;
            will-change: transform;
            cursor: grab;
        }

        .card-3d:active {
            cursor: grabbing;
        }

        /* Rotation fluide du carrousel */
        @keyframes rotateCarousel {
            from {
                transform: perspective(1300px) rotateY(0deg);
            }
            to {
                transform: perspective(1300px) rotateY(360deg);
            }
        }

        /* Chaque carte */
        .card-3d div {
            position: absolute;
            width: 150px;
            height: 180px;
            top: 50%;
            left: 50%;
            background: linear-gradient(145deg, rgba(28, 34, 54, 0.95), rgba(18, 22, 40, 0.9));
            backdrop-filter: blur(4px);
            border-radius: 1.5rem;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transform-origin: center center;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            animation: cardGlow 8s ease-in-out infinite;
            will-change: transform, border-width, box-shadow;
            font-family: 'Inter', sans-serif;
            color: #f0f3fc;
            text-align: center;
            padding: 12px 8px;
            backface-visibility: visible;
        }

        /* Animation de brillance subtile individuelle */
        @keyframes cardGlow {
            0% {
                box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
                border-color: rgba(255, 255, 255, 0.2);
            }
            50% {
                box-shadow: 0 22px 38px -12px rgba(0, 0, 0, 0.7), inset 0 0 12px rgba(255, 220, 100, 0.2);
                border-color: rgba(255, 210, 120, 0.5);
            }
            100% {
                box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
                border-color: rgba(255, 255, 255, 0.2);
            }
        }

        /* Icônes (images vectorielles) */
        .card-3d div i {
            font-size: 3.6rem;
            filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4));
            transition: transform 0.2s ease;
        }

        /* Texte stylé */
        .card-3d div span {
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            background: linear-gradient(120deg, #ffffff, #d9e2ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        /* Pause du carrousel au survol global */
        .card-3d:hover {
            animation-play-state: paused !important;
        }

        .card-3d:hover div {
            animation-play-state: paused !important;
        }

        /* EFFET AU SURVOL D'UNE CARTE : ZOOM (scale) + BORDURE DISPARAÎT (border-width: 0) */
        .card-3d div:hover {
            transform: translate(-50%, -50%) scale(1.1) !important;   /* zoom 10% */
            border-width: 0px !important;                              /* bordure diminue jusqu'à disparaître */
            border-color: transparent !important;
            background: linear-gradient(145deg, rgba(50, 62, 95, 0.98), rgba(32, 42, 70, 0.96));
            box-shadow: 0 32px 48px -14px rgba(0, 0, 0, 0.8), inset 0 0 18px rgba(255, 215, 120, 0.5);
            transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .card-3d div:hover i {
            transform: scale(1.08);
            filter: drop-shadow(0 0 10px rgba(255, 210, 90, 0.8));
        }

        /* Positionnement 3D des 10 cartes (rayon augmenté pour plus de relief) */
        .card-3d div:nth-child(1) { transform: translate(-50%, -50%) rotateY(0deg) translateZ(280px); animation-delay: 0s; }
        .card-3d div:nth-child(2) { transform: translate(-50%, -50%) rotateY(36deg) translateZ(280px); animation-delay: -3s; }
        .card-3d div:nth-child(3) { transform: translate(-50%, -50%) rotateY(72deg) translateZ(280px); animation-delay: -6s; }
        .card-3d div:nth-child(4) { transform: translate(-50%, -50%) rotateY(108deg) translateZ(280px); animation-delay: -9s; }
        .card-3d div:nth-child(5) { transform: translate(-50%, -50%) rotateY(144deg) translateZ(280px); animation-delay: -12s; }
        .card-3d div:nth-child(6) { transform: translate(-50%, -50%) rotateY(180deg) translateZ(280px); animation-delay: -15s; }
        .card-3d div:nth-child(7) { transform: translate(-50%, -50%) rotateY(216deg) translateZ(280px); animation-delay: -18s; }
        .card-3d div:nth-child(8) { transform: translate(-50%, -50%) rotateY(252deg) translateZ(280px); animation-delay: -21s; }
        .card-3d div:nth-child(9) { transform: translate(-50%, -50%) rotateY(288deg) translateZ(280px); animation-delay: -24s; }
        .card-3d div:nth-child(10) { transform: translate(-50%, -50%) rotateY(324deg) translateZ(280px); animation-delay: -27s; }

        /* Responsive : ajustement pour tablettes et mobiles */
        @media (max-width: 850px) {
            .card-3d {
                width: 600px;
                height: 340px;
                transform: perspective(1000px) scale(0.9);
            }
            .card-3d div {
                width: 120px;
                height: 150px;
                gap: 10px;
            }
            .card-3d div i {
                font-size: 2.8rem;
            }
            .card-3d div span {
                font-size: 0.8rem;
            }
            .card-3d div:nth-child(1) { transform: translate(-50%, -50%) rotateY(0deg) translateZ(220px); }
            .card-3d div:nth-child(2) { transform: translate(-50%, -50%) rotateY(36deg) translateZ(220px); }
            .card-3d div:nth-child(3) { transform: translate(-50%, -50%) rotateY(72deg) translateZ(220px); }
            .card-3d div:nth-child(4) { transform: translate(-50%, -50%) rotateY(108deg) translateZ(220px); }
            .card-3d div:nth-child(5) { transform: translate(-50%, -50%) rotateY(144deg) translateZ(220px); }
            .card-3d div:nth-child(6) { transform: translate(-50%, -50%) rotateY(180deg) translateZ(220px); }
            .card-3d div:nth-child(7) { transform: translate(-50%, -50%) rotateY(216deg) translateZ(220px); }
            .card-3d div:nth-child(8) { transform: translate(-50%, -50%) rotateY(252deg) translateZ(220px); }
            .card-3d div:nth-child(9) { transform: translate(-50%, -50%) rotateY(288deg) translateZ(220px); }
            .card-3d div:nth-child(10) { transform: translate(-50%, -50%) rotateY(324deg) translateZ(220px); }
        }

        @media (max-width: 640px) {
            .card-3d {
                width: 480px;
                height: 280px;
                transform: perspective(800px) scale(0.85);
            }
            .card-3d div {
                width: 100px;
                height: 125px;
                gap: 6px;
                border-radius: 1rem;
            }
            .card-3d div i {
                font-size: 2.2rem;
            }
            .card-3d div span {
                font-size: 0.7rem;
            }
            .card-3d div:nth-child(1) { transform: translate(-50%, -50%) rotateY(0deg) translateZ(180px); }
            .card-3d div:nth-child(2) { transform: translate(-50%, -50%) rotateY(36deg) translateZ(180px); }
            .card-3d div:nth-child(3) { transform: translate(-50%, -50%) rotateY(72deg) translateZ(180px); }
            .card-3d div:nth-child(4) { transform: translate(-50%, -50%) rotateY(108deg) translateZ(180px); }
            .card-3d div:nth-child(5) { transform: translate(-50%, -50%) rotateY(144deg) translateZ(180px); }
            .card-3d div:nth-child(6) { transform: translate(-50%, -50%) rotateY(180deg) translateZ(180px); }
            .card-3d div:nth-child(7) { transform: translate(-50%, -50%) rotateY(216deg) translateZ(180px); }
            .card-3d div:nth-child(8) { transform: translate(-50%, -50%) rotateY(252deg) translateZ(180px); }
            .card-3d div:nth-child(9) { transform: translate(-50%, -50%) rotateY(288deg) translateZ(180px); }
            .card-3d div:nth-child(10) { transform: translate(-50%, -50%) rotateY(324deg) translateZ(180px); }
        }

        /* Badge d'instruction */
        .instruction {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
            color: #b9c3e6;
            background: rgba(5, 10, 20, 0.65);
            backdrop-filter: blur(10px);
            width: fit-content;
            margin: 0 auto;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 500;
            letter-spacing: 0.2px;
            pointer-events: none;
            z-index: 20;
            border: 1px solid rgba(255,255,210,0.2);
            font-family: 'Inter', sans-serif;
        }

        .instruction i {
            margin-right: 6px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

<div class="card-3d">
    <!-- Chaque carte contient une icône FontAwesome (image vectorielle) + texte -->
    <div>
        <i class="fab fa-html5" style="color: #E44D26;"></i>
        <span>HTML5</span>
    </div>
    <div>
        <i class="fab fa-css3-alt" style="color: #1572B6;"></i>
        <span>CSS3</span>
    </div>
    <div>
        <i class="fab fa-bootstrap" style="color: #7952B3;"></i>
        <span>Bootstrap 5</span>
    </div>
    <div>
        <i class="fas fa-pen-ruler" style="color: #9C27B0;"></i>

    </div>
    <div>
        <i class="fab fa-figma" style="color: #F24E1E;"></i>

<!-- <div class="instruction">
    <i class="fas fa-mouse-pointer"></i> Pause au survol · Carte zoom + bordure disparaît
</div> -->

<!-- Petit script pour améliorer l'interaction tactile -->
<script>
    (function() {
        const carousel = document.querySelector('.card-3d');
        if(carousel) {
            // Sur mobile : un tap met en pause pour permettre l'exploration
            carousel.addEventListener('touchstart', (e) => {
                carousel.style.animationPlayState = 'paused';
            });
        }
        // Optionnel : effet de transition supplémentaire pour les icônes
        const cards = document.querySelectorAll('.card-3d div');
        cards.forEach(card => {
            card.addEventListener('mouseenter', () => {
                let icon = card.querySelector('i');
                if(icon) icon.style.transition = 'transform 0.2s ease';
            });
            card.addEventListener('mouseleave', () => {
                let icon = card.querySelector('i');
                if(icon) icon.style.transform = '';
            });
        });
    })();
</script>
</body>
</html>
